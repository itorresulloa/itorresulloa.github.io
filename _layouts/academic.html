---
layout: default
---

<main id="main" class="academic-main{% if page.url == '/' %} academic-main--home{% endif %}">
  <article class="academic-page">
    {% if page.title and page.title != '' %}
      <header class="academic-page__header">
        <h1 class="page__title">{{ page.title }}</h1>
      </header>
    {% endif %}
    <div class="academic-content">{{ content }}</div>
  </article>
</main>
